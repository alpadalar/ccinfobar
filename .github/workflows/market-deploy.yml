name: Marketplace deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/market/**'
      - 'src/core/entry-keys.ts'
      - 'src/core/sanitize.ts'
      - 'worker/**'
      - 'scripts/build.mjs'
      - 'scripts/worker-options.mjs'
      - '.github/workflows/market-deploy.yml'

permissions:
  contents: read

concurrency:
  group: market-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # skipped until the MARKET_URL repository variable is set
    if: github.repository == 'alpadalar/ccinfobar' && vars.MARKET_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      # pinned by commit: this job later gets the Cloudflare token (IN-08)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run test/market
      - run: node scripts/build.mjs --worker
      - name: Check config
        working-directory: worker
        run: ../node_modules/.bin/wrangler deploy --dry-run
      # wrangler takes no backup of a production D1; this bookmark is the point to restore to
      - name: Record a Time Travel bookmark
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../node_modules/.bin/wrangler d1 time-travel info ccinfobar-market --json
      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../node_modules/.bin/wrangler d1 migrations apply ccinfobar-market --remote
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../node_modules/.bin/wrangler deploy
      - name: Smoke check
        env:
          MARKET_URL: ${{ vars.MARKET_URL }}
        run: |
          url="${MARKET_URL%/}"
          curl -fsS --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors "$url/v1/meta.json"
          curl -fsS --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors "$url/" -o /dev/null
