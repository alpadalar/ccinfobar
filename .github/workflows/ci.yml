name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node scripts/build.mjs --worker

  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Smoke test
        shell: bash
        run: |
          node dist/ccinfobar.js --version
          node dist/ccinfobar.js --payload test/fixtures/payload.json --width 120
          node dist/ccinfobar.js preview --width 120

  test-tr-locale:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      LANG: tr_TR.UTF-8
      LC_ALL: tr_TR.UTF-8
    steps:
      - uses: actions/checkout@v7
      - name: Generate the Turkish locale
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo locale-gen tr_TR.UTF-8 || { echo 'tr_TR.UTF-8 UTF-8' | sudo tee -a /etc/locale.gen && sudo locale-gen; }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirm the ICU default is Turkish
        shell: bash
        run: node -e "const l=Intl.DateTimeFormat().resolvedOptions().locale;console.log(l);if(!/^tr\b/.test(l))process.exit(1)"
      - run: npm run check

  clean-install:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Clean install, render and uninstall
        shell: bash
        run: node scripts/clean-install.mjs
      - name: Bench (informational)
        continue-on-error: true
        shell: bash
        run: npm run build >/dev/null && node dist/ccinfobar.js bench --runs 10 --json

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate marketplace and plugin
        shell: bash
        env:
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          export HOME="$RUNNER_TEMP/home" CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          mkdir -p "$HOME" "$CLAUDE_CONFIG_DIR"
          npm install --prefix "$RUNNER_TEMP/cc" --no-audit --no-fund @anthropic-ai/claude-code@2.1.299
          CC="$RUNNER_TEMP/cc/node_modules/.bin/claude"
          "$CC" --version
          "$CC" plugin validate --strict .
          "$CC" plugin validate --strict ./plugin
          "$CC" --plugin-dir ./plugin plugin details ccinfobar | tee "$RUNNER_TEMP/details.txt"
          grep -F 'Skills (5)' "$RUNNER_TEMP/details.txt"
          grep -F 'Hooks (0)' "$RUNNER_TEMP/details.txt"
