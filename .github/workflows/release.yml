name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then echo "::error::tag $GITHUB_REF_NAME is not $want"; exit 1; fi
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - name: Pack
        run: |
          npm pack
          cp ccinfobar-*.tgz ccinfobar.tgz
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v tag="${GITHUB_REF_NAME#v}" 'index($0, "## [" tag "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo 'See CHANGELOG.md' > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" ccinfobar.tgz ccinfobar-*.tgz \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
      # trusted publishing: npmjs.com > ccinfobar > Settings
      - name: Publish to npm
        if: vars.NPM_PUBLISH == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "ccinfobar@$version" version >/dev/null 2>&1; then
            echo "ccinfobar@$version is already on npm"
            exit 0
          fi
          # trusted publishing needs npm 11.5.1+
          npm install -g npm@11.21.1
          npm publish --access public --ignore-scripts
