name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - name: Pack
        run: |
          npm pack
          cp ccinfobar-*.tgz ccinfobar.tgz
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v tag="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" tag "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" ccinfobar.tgz ccinfobar-*.tgz \
            --title "$GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
      # trusted publishing: npmjs.com > ccinfobar > Settings
      - name: Publish to npm
        if: vars.NPM_PUBLISH == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "ccinfobar@$version" version >/dev/null 2>&1; then
            echo "ccinfobar@$version is already on npm"
            exit 0
          fi
          npm install -g npm@latest
          npm publish --access public
