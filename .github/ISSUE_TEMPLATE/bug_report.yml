name: Bug report
description: Something renders wrong or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ccinfobar init gsd
        2. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ccinfobar doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config (optional)
      description: Your config.json, with anything private removed.
      render: json
  - type: input
    id: terminal
    attributes:
      label: OS and terminal
      placeholder: macOS 26, Ghostty / Windows 11, Windows Terminal
    validations:
      required: true
